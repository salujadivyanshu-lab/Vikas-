name: Deploy Angular frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Configure API endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e "const fs = require('node:fs'); const apiBaseUrl = process.env.API_BASE_URL; if (!apiBaseUrl) throw new Error('Set the API_BASE_URL Actions repository variable to your API URL ending in /api.'); fs.writeFileSync('frontend/src/environments/environment.ts', 'export const environment = { production: true, apiBaseUrl: ' + JSON.stringify(apiBaseUrl.replace(/\\/$/, '')) + ' };\\n');"

      - name: Build Angular app
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
        run: npm --prefix frontend run build -- --base-href "$BASE_HREF"

      - name: Add SPA fallback
        run: cp frontend/dist/Vikas/browser/index.html frontend/dist/Vikas/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/Vikas/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
